services:
  recipe-app:
    build: .
    image: recipe-app
    container_name: recipe-app
    restart: unless-stopped
    ports:
      - "8090:8080"
    secrets:
      - ConnectionStrings__Default
      - Api__Key
    volumes:
      - recipe-data:/app/data

secrets:
  Api__Key:
    file: ./secrets/api_key.txt   # never commit; generate with: openssl rand -base64 32
  ConnectionStrings__Default:
    file: ./secrets/db_connection_string.txt

volumes:
  recipe-data:
    name: recipe-data
