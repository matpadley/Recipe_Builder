services:
  recipe-app:
    build: .
    image: recipe-app
    container_name: recipe-app
    restart: unless-stopped
    ports:
      - "8090:8080"
    secrets:
      - ConnectionStrings__Default
      - UseDatabase
    volumes:
      - recipe-data:/app/data

secrets:
  ConnectionStrings__Default:
    file: ./secrets/db_connection_string.txt
  UseDatabase:
    file: ./secrets/UseDatabase.txt

volumes:
  recipe-data:
    name: recipe-data
